
name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        run: |
          python train_model.py

          test -s scores.txt
          test -s ConfusionMatrix.png
          test -s FeatureImportance.png

      - name: Create ML Report
        run: |
          echo "# Model Training Report" > report.md
          echo "" >> report.md
          echo "## Random Forest and Logistic Regression Scores" >> report.md
          cat scores.txt >> report.md
          echo "" >> report.md
          echo "Confusion Matrix and Feature Importance plots are available in the GitHub Actions artifacts." >> report.md

      - name: Upload Model Reports
        uses: actions/upload-artifact@v4
        with:
          name: ML-Training-Reports
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: error

      - name: Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create --publish=false report.md
